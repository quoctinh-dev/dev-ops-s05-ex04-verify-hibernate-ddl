server:
    port: ${RESTAURANT_SERVER_PORT:8082}

spring:
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${RESTAURANT_DB_NAME:quickbite_restaurant_db}
        username: ${RESTAURANT_DB_USERNAME:postgres}
        password: ${RESTAURANT_DB_PASSWORD:secret}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect