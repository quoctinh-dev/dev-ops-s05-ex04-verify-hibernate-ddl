server:
    port: ${ORDER_SERVER_PORT:8083}

spring:
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${ORDER_DB_NAME:quickbite_order_db}
        username: ${ORDER_DB_USERNAME:postgres}
        password: ${ORDER_DB_PASSWORD:secret}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect