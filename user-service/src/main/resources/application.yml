server:
    port: ${USER_SERVER_PORT:8081}

spring:
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${USER_DB_NAME:quickbite_user_db}
        username: ${USER_DB_USERNAME:postgres}
        password: ${USER_DB_PASSWORD:secret}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect